<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://use.typekit.net/sxz6nic.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>Hollow Frequency</title>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>

  <body>
    <div class="newsletter-container">
      <header>
        <!-- website logo -->
        <a href="index.html">
          <h1>
            <img src="images/HFLogo.svg" alt="Hollow Frequency." />
          </h1>
        </a>
        <!-- nav bar -->
        <nav>
          <ul>
            <li>
              <a href="#">News</a>
            </li>
            <li>
              <a href="#">Banners</a>
            </li>
            <li>
              <a href="#">Events</a>
            </li>
            <li>
              <a href="#">Guides</a>
            </li>
            <li>
              <a href="#">Culture</a>
            </li>
          </ul>
        </nav>
      </header>

      <main>
        <section class="newsletter">
          <h2>Subscribe to Hollow Frequency</h2>
          <p>
            Get the latest news, banner updates, event coverage, guides, and
            culture articles delivered straight to your inbox.
          </p>

          <form>
            <ul>
              <li>
                <label for="name">Name</label>
                <input
                  type="text"
                  name="name"
                  id="name"
                  placeholder="Your name"
                />
              </li>

              <li>
                <label for="email">Email Address</label>
                <input
                  type="email"
                  name="email"
                  id="email"
                  placeholder="you@example.com"
                />
              </li>

              <li>
                <h3>What content are you interested in?</h3>

                <div class="options">
                  <div class="option">
                    <input type="checkbox" id="news" name="interest" />
                    <label for="news">News</label>
                  </div>
                  <div class="option">
                    <input type="checkbox" id="banners" name="interest" />
                    <label for="banners">Banners</label>
                  </div>
                  <div class="option">
                    <input type="checkbox" id="events" name="interest" />
                    <label for="events">Events</label>
                  </div>
                  <div class="option">
                    <input type="checkbox" id="guides" name="interest" />
                    <label for="guides">Guides</label>
                  </div>
                  <div class="option">
                    <input type="checkbox" id="culture" name="interest" />
                    <label for="culture">Culture</label>
                  </div>
                </div>
              </li>

              <li>
                <h3>Email Frequency</h3>

                <div class="options">
                  <div class="option">
                    <input
                      type="radio"
                      id="weekly"
                      name="frequency"
                      value="weekly"
                      checked
                    />
                    <label for="weekly">Weekly</label>
                  </div>
                  <div class="option">
                    <input
                      type="radio"
                      id="monthly"
                      name="frequency"
                      value="monthly"
                    />
                    <label for="monthly">Monthly</label>
                  </div>
                </div>
              </li>

              <li>
                <button type="submit">Subscribe</button>
              </li>
            </ul>
          </form>
        </section>
      </main>

      <footer>
        <p>All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
